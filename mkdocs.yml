site_name: proffssv.site
site_url: https://proffssv.site
site_description: Образовательная платформа профессора Сушкова С.В. — курсы, лекции, статьи по хирургии и онкологии.
site_author: Prof. Sergey V. Sushkov
repo_url: https://github.com/Serg2206/proffssv.site
edit_uri: edit/master/docs/
copyright: "© 2026 Prof. Sergey V. Sushkov. Все материалы предназначены для образовательных целей."

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/account-heart
  favicon: assets/favicon.svg

extra:
  social:
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@SSVproff-22.06
      name: YouTube
    - icon: fontawesome/brands/github
      link: https://github.com/Serg2206
      name: GitHub
    - icon: material/coffee
      link: https://www.buymeacoffee.com/ssvproff
      name: Buy Me a Coffee

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Главная: index.md
  - О профессоре: about.md
  - Экспертиза:
      - Обзор направлений: expertise/index.md
      - Клиническая экспертиза: expertise/clinical-expertise.md
      - Научно-редакционные услуги: expertise/scientific-editing.md
      - Международный медицинский туризм: expertise/medical-tourism.md
      - Академическое сотрудничество: expertise/academic-cooperation.md
      - AI и цифровая медицина: expertise/ai-digital-medicine.md
  - Курсы:
      - Основы лапароскопической холецистэктомии: courses/laparoscopic-cholecystectomy-basics.md
  - Консультации: consultations.md
  - Рекомендую: recommend.md
  - Поддержать: support.md
