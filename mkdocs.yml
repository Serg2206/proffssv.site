site_name: Профессор Сушков С.В. — хирург, онкохирург
site_url: https://proffssv.site
site_description: Профессор Сушков Сергей Валентинович — хирург, онкохирург, д.мед.н. Консультации, второе мнение, экспертиза, статьи по хирургии, онкологии и науке.
site_author: Prof. Sergey V. Sushkov
repo_url: https://github.com/Serg2206/proffssv.site
edit_uri: edit/master/docs/
copyright: "© 2026 Проф. С.В. Сушков. Информация носит ознакомительный характер и не заменяет очной консультации врача."

theme:
  name: material
  custom_dir: overrides
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/account-heart
  favicon: assets/favicon.svg

extra:
  analytics:
    provider: google
    property: G-849M3X6NTX
  social:
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@SSVproff-22.06
      name: YouTube
    - icon: fontawesome/brands/github
      link: https://github.com/Serg2206
      name: GitHub
    - icon: material/coffee
      link: https://www.buymeacoffee.com/ssvproff
      name: Buy Me a Coffee

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Главная: index.md
  - О профессоре: about.md
  - Экспертиза:
      - Обзор направлений: expertise/index.md
      - Клиническая экспертиза: expertise/clinical-expertise.md
      - Научно-редакционные услуги: expertise/scientific-editing.md
      - Международный медицинский туризм: expertise/medical-tourism.md
      - Академическое сотрудничество: expertise/academic-cooperation.md
      - AI и цифровая медицина: expertise/ai-digital-medicine.md
  - Статьи:
      - Все статьи: articles/index.md
      - "«Тихое давление»: оперировать высокий риск": articles/quiet-pressure.md
      - Второе мнение перед операцией: articles/second-opinion-checklist.md
      - Анатомия отказа журнала: articles/anatomy-of-rejection.md
      - Дорожная карта соискателя: articles/dissertation-roadmap.md
      - Пять вопросов зарубежной клинике: articles/five-questions-abroad.md
      - Руки — первый ум хирурга: articles/hands-first-mind.md
      - Биомаркеры перитонита: articles/peritonitis-biomarkers.md
      - AI в неотложной хирургии: articles/ai-emergency-surgery.md
  - Курсы:
      - Основы лапароскопической холецистэктомии: courses/laparoscopic-cholecystectomy-basics.md
  - Консультации: consultations.md
  - Контакты и запись: contacts.md
  - Рекомендую: recommend.md
  - Поддержать: support.md
